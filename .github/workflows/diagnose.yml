name: Diagnose production

# One-off diagnostic: fetches pages from the deployed Worker and dumps status,
# headers, and body to the run summary. Exists because this sandbox's egress
# policy blocks *.workers.dev outright — GitHub's runners aren't behind that
# restriction, so this is the way to see what production actually returns
# without needing any Cloudflare credentials (it's all public HTTP).
#
# Safe to delete once the signup/login issue is understood; this isn't meant to
# be a permanent fixture.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to check"
        type: string
        default: "https://hksoftware-real-estate-app.hksoftware.workers.dev"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      # Everything below is `tee`'d to stdout as well as the summary. The summary
      # is only visible in the GitHub UI — there's no API for it — so the first
      # version of this workflow wrote real evidence nowhere retrievable.
      - name: Fetch key pages
        env:
          BASE: ${{ inputs.base_url }}
        run: |
          check() {
            path="$1"
            { echo "## $path"; echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            # -D- prints response headers ahead of the body.
            curl -sS -D- -o body.html -w "\nHTTP_STATUS:%{http_code}\n" "$BASE$path" 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY" || echo "curl failed: $?" | tee -a "$GITHUB_STEP_SUMMARY"
            { echo '```'; echo; echo "First 4000 chars of body:"; echo '```html'; } | tee -a "$GITHUB_STEP_SUMMARY"
            head -c 4000 body.html | tee -a "$GITHUB_STEP_SUMMARY"
            { echo; echo '```'; echo; } | tee -a "$GITHUB_STEP_SUMMARY"
            cp body.html "saved-$(echo "$path" | tr '/' '_').html"
          }
          check "/signup"
          check "/login"
          check "/"

      - name: Extract script tags and nonces from signup page
        run: |
          { echo "## Script tags on /signup"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -oE '<script[^>]*>' "saved-_signup.html" | head -40 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full bodies
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-bodies-${{ github.run_number }}
          path: saved-*.html
          retention-days: 7
