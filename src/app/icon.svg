<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ComfyLease">
  <!-- An orange cat asleep on a blue cushion. Seven shapes, one 32-unit grid.

       The cushion is the brand-600 token from globals.css, resolved out of
       oklch() to #1f6f8b because SVG favicons are parsed by contexts that
       predate oklch support. The cat is a warm orange with a darker orange
       for the tabby stripes and a near-black brown for the closed eyes.

       Everything below the ears is deliberately one soft lump: at 16px the
       silhouette is all that survives, and the two ear points are what make
       that silhouette read as a cat. The eyes, stripes and tail are for 32px
       and up. The raster icons (apple-icon.png, public/icons/*) are rendered
       from this file by scripts/lib/mark-render.mjs — edit here, re-run those. -->

  <!-- cushion -->
  <path d="M1 22c0-3 6.5-5.5 15-5.5s15 2.5 15 5.5c0 4.5-6.5 8-15 8S1 26.5 1 22z" fill="#1f6f8b"/>

  <!-- tail, curled off the back onto the cushion -->
  <path d="M27.5 19c2.8 1.2 2.4 5-1.6 5" fill="none" stroke="#e8923a" stroke-width="2.4" stroke-linecap="round"/>

  <!-- body and head, one curled lump -->
  <path d="M4.5 19.5C1.5 15 4 8.5 10 8.5c2.5 0 3.5 1.2 4.5 1.2 8-1 13 3.2 13 8 0 2.2-2.2 3.8-5 3.8H7.5c-1.8 0-3-1-3-2z" fill="#e8923a"/>

  <!-- ears: wide bases that sit into the head, curved outer edges, soft tips.
       Same colour as the body so the overlap is invisible; the thin stroke
       with round joins rounds the tips off instead of leaving needle points. -->
  <path d="M5.4 11.2C4.4 9.2 4.2 6.6 4.9 4.4c2 .9 3.9 2.5 5.4 4.6z" fill="#e8923a" stroke="#e8923a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M12.2 9.5c1-2.2 2.2-4 3.6-5.2.9 1.8 1.3 3.9 1.3 6z" fill="#e8923a" stroke="#e8923a" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- tabby stripes across the back -->
  <path d="M19.5 12.3l-1 3.2M23 12.8l-1 3.2" fill="none" stroke="#c7712a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- closed eyes: two gentle downward arcs -->
  <path d="M7.2 15q1.2 1.1 2.5 0M12.2 15q1.2 1.1 2.5 0" fill="none" stroke="#4a2a10" stroke-width="1.5" stroke-linecap="round"/>
</svg>
