<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ComfyLease">
  <!-- Mirrors the wordmark badge in src/components/logo.tsx: a brand-coloured
       rounded square with a roofline mark. Kept as SVG so it stays sharp at
       every size a browser asks for, including the 16px tab favicon. #1f6f8b
       is --color-brand-600 from globals.css, resolved out of oklch() because
       SVG favicons are parsed by contexts that predate oklch support.

       A peaked roof, a chimney rising off its left slope, a door, and the
       ground line beneath — four strokes, same weight throughout. Matches the
       raster version generated by scripts/generate-apple-icon.mjs. -->
  <rect width="32" height="32" rx="7" fill="#1f6f8b"/>
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 19 16 7 26 19"/>
    <path d="M5 26h22"/>
    <path d="M9 17V9h4v8"/>
    <rect x="13" y="20" width="6" height="6"/>
  </g>
</svg>
